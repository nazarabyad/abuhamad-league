<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دوري أبوحمد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#10224a;--gold:#f2b705;--bg:#f3f5fa;--ink:#16203a;--line:#dde2ee}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 12px 0;position:sticky;top:0;z-index:5}
h1{margin:0 0 8px;font-size:22px;font-weight:900;color:var(--gold)}
nav{display:flex;gap:4px;overflow-x:auto}nav a{color:#cfd7ee;text-decoration:none;padding:9px 14px;border-radius:10px 10px 0 0;white-space:nowrap;font-weight:700}
nav a.on{background:var(--bg);color:var(--navy)}
main{padding:12px;max-width:760px;margin:auto}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;overflow-x:auto}
h2{font-size:17px;margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right}
tr.top td{background:#fff8dc}.pts{font-weight:900;color:var(--navy)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.m b{background:var(--navy);color:#fff;border-radius:6px;padding:2px 10px;min-width:54px;text-align:center}.m span:last-child{text-align:left}
input,select,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;margin:2px 0}
input.s{width:52px;text-align:center}button{background:var(--navy);color:#fff;border:0;font-weight:700}button.g{background:var(--gold);color:#222}button.r{background:#c4182c}
.y{background:#f2b705;display:inline-block;width:11px;height:15px;border-radius:2px}.rd{background:#c4182c;display:inline-block;width:11px;height:15px;border-radius:2px}
.muted{color:#6a7390;font-size:13px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style></head><body>
<header><h1>دوري أبوحمد</h1><nav id="nav"></nav></header><main id="app">جاري التحميل...</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,setDoc,updateDoc,addDoc,deleteDoc,writeBatch,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyARIucb_F8amIvH4EYJgvBopN7eDgfYzHQ",authDomain:"abuhamad-league.firebaseapp.com",projectId:"abuhamad-league",storageBucket:"abuhamad-league.firebasestorage.app",messagingSenderId:"345300837084",appId:"1:345300837084:web:772bfbe4e88f2a7eda0a19"});
const db=getFirestore(app),auth=getAuth(app);
const NAMES=["الفوز","الشروق","الأمل","القلعة","الشرطة","الكفاح","السد","الأهلي","السلام","السليم"];
const COL=["#1e4fb5","#e08a1e","#1f9a4a","#c4182c","#14305f","#6b3fa0","#1b7f8c","#a3121f","#2a8de0","#6b6f76"];
const WEEKS=["1-10,2-9,3-8,4-7,5-6","1-9,8-10,2-7,3-6,4-5","1-8,7-9,6-10,5-2,4-3","1-7,8-6,9-5,10-4,3-2","1-6,7-5,8-4,3-9,2-10","1-5,4-6,3-7,2-8,10-9","1-4,5-3,6-2,7-10,9-8","1-3,4-2,5-10,6-9,7-8","1-2,10-3,4-9,8-5,7-6"];
let T={},M=[],C=[],user=null;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const tn=id=>T[id]?`<i class="dot" style="background:${T[id].color}"></i>${e(T[id].name)}`:'؟';
const mine=()=>{try{return localStorage.getItem('club')}catch(x){return null}};
onSnapshot(collection(db,'teams'),s=>{T={};s.forEach(d=>T[d.id]={...d.data(),id:d.id});render()});
onSnapshot(collection(db,'matches'),s=>{M=s.docs.map(d=>({...d.data(),id:d.id}));render()});
onSnapshot(collection(db,'cards'),s=>{C=s.docs.map(d=>({...d.data(),id:d.id}));render()});
onAuthStateChanged(auth,u=>{user=u;render()});
addEventListener('hashchange',render);
function table(){const r={};Object.keys(T).forEach(id=>r[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0});
M.filter(m=>m.done).forEach(m=>{const a=r[m.home],b=r[m.away];if(!a||!b)return;a.p++;b.p++;a.gf+=m.hg;a.ga+=m.ag;b.gf+=m.ag;b.ga+=m.hg;
if(m.hg>m.ag){a.w++;b.l++}else if(m.hg<m.ag){b.w++;a.l++}else{a.d++;b.d++}});
return Object.values(r).map(x=>({...x,gd:x.gf-x.ga,pts:x.w*3+x.d})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)}
function standings(){const t=table();return `<div class="box"><h2>ترتيب الدوري</h2><table><tr><th>#</th><th class="n">الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>فرق</th><th>نقاط</th></tr>`+
t.map((x,i)=>`<tr class="${i==0&&x.p?'top':''}"><td>${i+1}</td><td class="n">${tn(x.id)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd}</td><td class="pts">${x.pts}</td></tr>`).join('')+`</table></div>`}
const mrow=m=>`<div class="m"><span>${tn(m.home)}</span><b>${m.done?m.hg+' - '+m.ag:'ضد'}</b><span>${tn(m.away)}</span></div>`;
function fixtures(list,title){const w={};list.forEach(m=>(w[m.week]=w[m.week]||[]).push(m));
return Object.keys(w).sort((a,b)=>a-b).map(k=>`<div class="box"><h2>${title||''}الأسبوع ${k}</h2>`+w[k].sort((a,b)=>a.n-b.n).map(mrow).join('')+`</div>`).join('')||'<div class="box muted">لا توجد مباريات بعد.</div>'}
function cardsOf(team){const o={};C.filter(c=>c.team==team).forEach(c=>{const x=o[c.player]=o[c.player]||{y:0,r:0};c.type=='r'?x.r++:x.y++});return o}
function club(){const id=mine();
if(!id||!T[id])return `<div class="box"><h2>دخول النادي</h2><p class="muted">اكتب كود ناديك الذي أعطاه لك الاتحاد.</p><div class="row"><input id="code" placeholder="كود النادي"><button onclick="clubIn()">دخول</button></div></div>`;
const t=T[id],x=table().find(r=>r.id==id),pos=table().indexOf(x)+1,cs=cardsOf(id);
return `<div class="box"><h2>${tn(id)}</h2><div class="row"><span>المركز <b>${pos}</b></span><span>النقاط <b>${x.pts}</b></span><span>لعب <b>${x.p}</b></span><span>فرق الأهداف <b>${x.gd}</b></span></div><button class="r" onclick="clubOut()">خروج</button></div>`+
`<div class="box"><h2>اللاعبون والكروت</h2><table>`+((t.players||[]).map(p=>`<tr><td class="n">${e(p)}</td><td>${cs[p]?.y?`<i class="y"></i> ${cs[p].y}`:''}</td><td>${cs[p]?.r?`<i class="rd"></i> ${cs[p].r}`:''}</td></tr>`).join('')||'<tr><td class="muted">لم تتم إضافة لاعبين بعد</td></tr>')+`</table></div>`+
fixtures(M.filter(m=>m.home==id||m.away==id),'')}
function admin(){if(!user)return `<div class="box"><h2>دخول الاتحاد</h2><div class="row"><input id="em" type="email" placeholder="البريد"><input id="pw" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button></div></div>`;
let h=`<div class="box"><button class="r" onclick="signOutA()">خروج</button></div>`;
if(!Object.keys(T).length)h+=`<div class="box"><h2>البداية</h2><p class="muted">اضغط لإضافة الأندية العشرة والـ 45 مباراة حسب الجدول.</p><button class="g" onclick="seed()">تجهيز الدوري</button></div>`;
const ids=Object.keys(T).sort((a,b)=>a-b),opt=ids.map(i=>`<option value="${i}">${e(T[i].name)}</option>`).join('');
h+=`<div class="box"><h2>إضافة لاعب</h2><div class="row"><select id="pt">${opt}</select><input id="pn" placeholder="اسم اللاعب"><button onclick="addP()">إضافة</button></div></div>`;
h+=`<div class="box"><h2>تسجيل كرت</h2><div class="row"><select id="ct" onchange="fillP()">${opt}</select><select id="cp"></select><select id="cy"><option value="y">أصفر</option><option value="r">أحمر</option></select><input class="s" id="cw" placeholder="أسبوع"><button onclick="addC()">تسجيل</button></div>`+
C.map(c=>`<div class="row muted">${e(T[c.team]?.name)} - ${e(c.player)} - ${c.type=='r'?'أحمر':'أصفر'} (أسبوع ${e(c.week)}) <button class="r" onclick="delC('${c.id}')">حذف</button></div>`).join('')+`</div>`;
h+=`<div class="box"><h2>أكواد الأندية</h2>`+ids.map(i=>`<div>${tn(i)}: <b>${e(T[i].code)}</b></div>`).join('')+`</div>`;
const w={};M.forEach(m=>(w[m.week]=w[m.week]||[]).push(m));
Object.keys(w).sort((a,b)=>a-b).forEach(k=>{h+=`<div class="box"><h2>نتائج الأسبوع ${k}</h2>`+w[k].sort((a,b)=>a.n-b.n).map(m=>`<div class="m"><span>${tn(m.home)}</span><span class="row"><input class="s" id="h${m.id}" value="${m.done?m.hg:''}"><input class="s" id="a${m.id}" value="${m.done?m.ag:''}"><button onclick="res('${m.id}')">حفظ</button></span><span>${tn(m.away)}</span></div>`).join('')+`</div>`});
return h}
function render(){const h=location.hash||'#standings',tabs=[['#standings','الترتيب'],['#fixtures','الجدول'],['#club','ناديي'],['#admin','الاتحاد']];
$('nav').innerHTML=tabs.map(t=>`<a href="${t[0]}" class="${h==t[0]?'on':''}">${t[1]}</a>`).join('');
$('app').innerHTML=h=='#fixtures'?fixtures(M):h=='#club'?club():h=='#admin'?admin():standings();
if($('cp'))fillP()}
Object.assign(window,{
clubIn(){const c=$('code').value.trim(),t=Object.values(T).find(x=>x.code==c);if(!t)return alert('الكود غير صحيح');try{localStorage.setItem('club',t.id)}catch(x){}render()},
clubOut(){try{localStorage.removeItem('club')}catch(x){}render()},
login(){signInWithEmailAndPassword(auth,$('em').value,$('pw').value).catch(()=>alert('البريد أو كلمة المرور غير صحيحة'))},
signOutA(){signOut(auth)},
async seed(){const b=writeBatch(db);NAMES.forEach((n,i)=>b.set(doc(db,'teams',String(i+1)),{name:n,color:COL[i],code:String(1000+Math.floor(Math.random()*9000)),players:[]}));
WEEKS.forEach((w,wi)=>w.split(',').forEach((p,i)=>{const[h,a]=p.split('-').map(Number);b.set(doc(db,'matches',`w${wi+1}m${i+1}`),{week:wi+1,n:i+1,home:String(h),away:String(a),done:false,hg:0,ag:0})}));await b.commit()},
async addP(){const t=$('pt').value,n=$('pn').value.trim();if(!n)return;await updateDoc(doc(db,'teams',t),{players:[...(T[t].players||[]),n]})},
fillP(){const t=$('ct').value;$('cp').innerHTML=(T[t]?.players||[]).map(p=>`<option>${e(p)}</option>`).join('')},
async addC(){if(!$('cp').value)return alert('أضف لاعباً أولاً');await addDoc(collection(db,'cards'),{team:$('ct').value,player:$('cp').value,type:$('cy').value,week:$('cw').value})},
delC(id){if(confirm('حذف الكرت؟'))deleteDoc(doc(db,'cards',id))},
async res(id){const h=$('h'+id).value,a=$('a'+id).value;await updateDoc(doc(db,'matches',id),h===''||a===''?{done:false,hg:0,ag:0}:{done:true,hg:+h,ag:+a})}});
</script></body></html>
